name: Build Linux

on:
  push:
    tags: ['v*']        # solo al cerrar una version (git push origin vX.Y)
  workflow_dispatch:     # o manualmente desde la pestana Actions
    inputs:
      arm64:
        description: 'Compilar tambien para ARM64 / Raspberry Pi (runner pago; en los tags corre siempre)'
        type: boolean
        default: false

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libasound2-dev \
            libxcb-xinerama0 libxcb-cursor0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp build id
        run: |
          echo "BUILD_ID = \"$(git rev-parse --short HEAD) $(date -u +%Y-%m-%d)\"" > src/buildinfo.py
          cat src/buildinfo.py

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller reductor-linux.spec --clean --noconfirm

      - name: Create ZIP
        run: |
          cd dist
          zip -r RadioNoiseKiller-linux-x86_64.zip RadioNoiseKiller/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioNoiseKiller-linux-x86_64
          path: dist/RadioNoiseKiller-linux-x86_64.zip
          retention-days: 30

  # ------------------------------------------------------------------------
  # ARM64 (Raspberry Pi). VERIFICADO en una Pi 4 real (25/10/2026, run
  # 40225963759, Raspberry Pi OS Trixie): arranca y rinde igual que desde el
  # fuente con bloque 960. Falta probarlo en Bookworm.
  #
  # CORRE EN CADA TAG de version (decision del usuario, 25/10/2026: el release
  # publica el paquete de la Pi junto con los de Windows y Linux x86_64), y a mano
  # con la opcion del Run workflow. Ojo con el costo: este repo es PRIVADO y los
  # runners ARM64 solo son gratis en repos PUBLICOS — en privados se facturan por
  # minuto (~1,5 min por corrida). Sin continue-on-error: si falla, el release
  # tiene que enterarse.
  #
  # Tarda ~1,5 min. Python 3.12 en aarch64 tiene wheels de PySide6/scipy/numpy,
  # asi que no hay que compilar nada desde fuente.
  #
  # Si algun run aparece "cancelled" con CERO pasos: no es este workflow. La
  # anotacion del job dice "The job was not acquired by Runner of type hosted
  # even after multiple attempts" — GitHub no consiguio asignar runner. Es
  # transitorio: reintentar mas tarde. Paso el 6/8 y al rato funciono solo.
  #
  # Dos decisiones que parecen arbitrarias y no lo son:
  #   - ubuntu-22.04-arm y no 24.04: un binario compilado contra una glibc mas
  #     nueva que la del destino no arranca. Raspberry Pi OS Bookworm trae
  #     glibc 2.36; 22.04 tiene 2.35 (sirve), 24.04 tiene 2.39 (no).
  #   - Python 3.12 y no 3.14: en aarch64 la disponibilidad de wheels
  #     (PySide6, scipy) va por detras de x86_64. Si con 3.12 tampoco hay
  #     wheels, pip intenta compilar desde fuente y el job se tarda muchisimo
  #     o falla.
  # ------------------------------------------------------------------------
  build-arm64:
    name: Linux ARM64 / Raspberry Pi
    if: github.event_name == 'push' || inputs.arm64
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libasound2-dev \
            libxcb-xinerama0 libxcb-cursor0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp build id
        run: |
          echo "BUILD_ID = \"$(git rev-parse --short HEAD) $(date -u +%Y-%m-%d) arm64\"" > src/buildinfo.py
          cat src/buildinfo.py

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller reductor-linux.spec --clean --noconfirm

      - name: Notas para la Raspberry Pi
        run: |
          cat > dist/RadioNoiseKiller/LEEME_RASPBERRY_PI.txt <<'EOF'
          RadioNoiseKiller — ARM64 / Raspberry Pi
          =======================================

          Probado en una Raspberry Pi 4 con Raspberry Pi OS de 64 bits (Trixie).
          Compilado en Ubuntu 22.04 ARM64 (glibc 2.35): deberia funcionar tambien
          en Bookworm (glibc 2.36), sin probar todavia. Requiere SO de 64 bits.

          Requiere del sistema:  libportaudio2  libxcb-xinerama0
              sudo apt install libportaudio2 libxcb-xinerama0

          Ejecutar:  ./RadioNoiseKiller/RadioNoiseKiller
          (si dice "Permission denied": chmod +x RadioNoiseKiller/RadioNoiseKiller)

          Restricciones medidas en la Pi 4:
            - Bloque de audio 960 (viene asi de fabrica en ARM). Con 480 corta.
            - Con 960 funcionan todos los modulos a la vez (~55 % de CPU).
            - La pestana Espectro no se puede usar con el procesamiento activo.
            - La salida HDMI directa de la Pi no abre y no aparece en la lista:
              usar una placa de audio USB o los auriculares.
          El contador "Cortes" (debajo del medidor de CPU) dice si la
          configuracion aguanta.

          Reportes en: https://github.com/gpagliaroli/RadioNoiseKiller/issues
          EOF
          cat dist/RadioNoiseKiller/LEEME_RASPBERRY_PI.txt

      - name: Create ZIP
        run: |
          cd dist
          zip -r RadioNoiseKiller-linux-aarch64.zip RadioNoiseKiller/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioNoiseKiller-linux-aarch64
          path: dist/RadioNoiseKiller-linux-aarch64.zip
          retention-days: 30
