name: Build Linux

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libasound2-dev \
            libxcb-xinerama0 libxcb-cursor0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller reductor-linux.spec --clean --noconfirm

      - name: Create ZIP
        run: |
          cd dist
          zip -r ReductorRuidoRadio-linux-x86_64.zip ReductorRuidoRadio/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReductorRuidoRadio-linux-x86_64
          path: dist/ReductorRuidoRadio-linux-x86_64.zip
          retention-days: 30
